name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @tysiac/shared build

      - name: Type-check server
        run: pnpm --filter @tysiac/server exec tsc --noEmit

      - name: Type-check web
        run: pnpm --filter @tysiac/web exec tsc --noEmit

      - name: Build web
        run: pnpm --filter @tysiac/web build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @tysiac/shared build

      - name: Run server tests
        run: pnpm --filter @tysiac/server test
