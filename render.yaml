services:
  - type: web
    name: tysiac-server
    runtime: docker
    dockerfilePath: apps/server/Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: DEBUG_API_KEY
        sync: false
